<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservasi Ruangan - RuangKu</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Form Reservasi</h1>
        <p class="subtitle">Silakan isi data reservasi ruangan</p>

        <form method="POST">

            <label>Nama Pemesan</label>
            <input type="text" name="nama" required>

            <label>NIM</label>
            <input type="text" name="nim" required>

            <label>Ruangan</label>
            <select name="ruangan" required>
                <option value="">-- Pilih Ruangan --</option>
                <option value="FBTS1">FBTS1 - 20 orang</option>
                <option value="FBTS2">FBTS2 - 20 orang</option>
                <option value="FBTS3">FBTS3 - 20 orang</option>
                <option value="FBTS4">FBTS4 - 20 orang</option>
                <option value="FBTS5">FBTS5 - 25 orang</option>
                <option value="FBTS6">FBTS6 - 25 orang</option>
                <option value="FBTS7">FBTS7 - 25 orang</option>
                <option value="FBTS8">FBTS8 - 25 orang</option>
                <option value="LAB">LAB - 15 orang</option>
            </select>

            <label>Tanggal</label>
            <input type="date" name="tanggal" required>

            <label>Jam Mulai</label>
            <input type="time" name="jam_mulai" required>

            <label>Jam Selesai</label>
            <input type="time" name="jam_selesai" required>

            <label>Jumlah Peserta</label>
            <input type="number" name="jumlah_peserta" min="1" required>

            <label>Keperluan</label>
            <textarea name="keperluan" rows="4" required></textarea>

            <button type="submit">Ajukan Reservasi</button>

        </form>

    </div>

</body>
</html>
